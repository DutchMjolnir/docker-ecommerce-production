name: Docker build and smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create test-only environment
        shell: bash
        run: |
          cat > .env <<EOF
          APP_ENV=production
          APP_DEBUG=false
          APP_KEY=base64:$(openssl rand -base64 32 | tr -d '\n')
          APP_URL=http://localhost:8000
          FRONTEND_URL=http://localhost:3000
          API_URL=http://backend/api
          NEXT_PUBLIC_API_URL=http://localhost:8000/api
          DB_CONNECTION=mysql
          DB_HOST=mysql
          DB_PORT=3306
          DB_DATABASE=ecommerce
          DB_USERNAME=ecommerce_user
          DB_PASSWORD=test_db_password_$(openssl rand -hex 8)
          MYSQL_ROOT_PASSWORD=test_root_password_$(openssl rand -hex 8)
          STRIPE_KEY=
          STRIPE_SECRET=
          LOG_LEVEL=warning
          EOF

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build all images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for healthy services
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 240))
          services=(mysql backend frontend)
          while (( SECONDS < deadline )); do
            all_healthy=true
            for service in "${services[@]}"; do
              container_id=$(docker compose ps -q "$service")
              status=missing
              if [[ -n "$container_id" ]]; then
                status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")
              fi
              if [[ "$status" == unhealthy || "$status" == exited || "$status" == dead ]]; then
                echo "Service $service reached state: $status"
                docker compose ps
                docker compose logs --no-color mysql backend frontend
                exit 1
              fi
              if [[ "$status" != healthy ]]; then
                all_healthy=false
              fi
            done
            if [[ "$all_healthy" == true ]]; then
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for healthy services."
          docker compose ps
          docker compose logs --no-color mysql backend frontend
          exit 1

      - name: Smoke test frontend
        run: curl --fail --show-error --retry 5 --retry-delay 3 --retry-connrefused http://localhost:3000/

      - name: Smoke test products API
        run: curl --fail --show-error --retry 5 --retry-delay 3 --retry-connrefused http://localhost:8000/api/products

      - name: Show stack diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color mysql backend frontend

      - name: Stop stack and remove volumes
        if: always()
        run: docker compose down -v